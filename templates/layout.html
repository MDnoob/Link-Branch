<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Link Branch{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    {% block extra_fonts %}{% endblock %}
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f0efec; color: #1a1a18; min-height: 100dvh; -webkit-font-smoothing: antialiased; }
        .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100dvh; }

        .sidebar { background: #181715; color: #cdccca; padding: 1rem 0.75rem; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100dvh; overflow-y: auto; }
        .sidebar-logo { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.75rem; margin-bottom: 0.75rem; font-weight: 600; font-size: 0.95rem; color: #fff; text-decoration: none; letter-spacing: -0.01em; }
        .nav-item { display: flex; align-items: center; gap: 0.55rem; padding: 0.5rem 0.75rem; border-radius: 7px; text-decoration: none; color: #6e6d6b; font-size: 0.875rem; font-weight: 500; transition: background 120ms, color 120ms; cursor: pointer; border: none; background: none; width: 100%; text-align: left; line-height: 1; }
        .nav-item svg { flex-shrink: 0; }
        .nav-item:hover { background: #252421; color: #cdccca; }
        .nav-item.active { background: #252421; color: #fff; }
        .sidebar-divider { height: 1px; background: #252421; margin: 0.5rem 0.75rem; }
        .sidebar-spacer { flex: 1; }
        .user-chip { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.75rem; border-radius: 8px; background: #252421; margin-top: 0.5rem; }
        .avatar-chip { width: 26px; height: 26px; border-radius: 50%; background: #01696f; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; color: #fff; flex-shrink: 0; text-transform: uppercase; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 0.825rem; font-weight: 500; color: #cdccca; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-handle { font-size: 0.72rem; color: #6e6d6b; }
        .logout-btn { background: none; border: none; color: #6e6d6b; cursor: pointer; padding: 0.2rem; display: flex; align-items: center; transition: color 120ms; flex-shrink: 0; }
        .logout-btn:hover { color: #cdccca; }

        {% block extra_styles %}{% endblock %}

        @media (max-width: 640px) { .app-shell { grid-template-columns: 1fr; } .sidebar { display: none; } }
    </style>
</head>
<body>
<div class="app-shell">

    <aside class="sidebar">
        <a href="/dashboard" class="sidebar-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3v18M3 12h18M7.8 7.8l8.4 8.4M16.2 7.8L7.8 16.2"/>
            </svg>
            Link Branch
        </a>

        <a href="/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
        </a>
        <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            My Page
        </a>
        <a href="/analytics" class="nav-item {% if active_page == 'analytics' %}active{% endif %}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Analytics
        </a>
        <a href="/admin" class="nav-item {% if active_page == 'admin' %}active{% endif %}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z"/><path d="m9.5 12 1.8 1.8L14.5 10.6"/></svg>
            Admin
        </a>
        <a href="/assets" class="nav-item {% if active_page == 'assets' %}active{% endif %}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 9 4-4 4 4 4-4 4 4"/><path d="M3 15h18"/></svg>
            My Assets
        </a>
        <a href="/my-profile" class="nav-item {% if active_page == 'my_profile' %}active{% endif %}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            My Profile
        </a>
        <a href="/profile/{{ user.username }}" class="nav-item" target="_blank" rel="noopener noreferrer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            My Public Page
        </a>

        <div class="sidebar-divider"></div>
        <div class="sidebar-spacer"></div>

        <div class="user-chip">
            <div class="avatar-chip">{{ user.username[0] }}</div>
            <div class="user-info">
                <div class="user-name">{{ user.display_name or user.username }}</div>
                <div class="user-handle">@{{ user.username }}</div>
            </div>
            <form action="/logout" method="get">
                <button type="submit" class="logout-btn" title="Log out">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </form>
        </div>
    </aside>

    {% block content %}{% endblock %}

</div>
<script>
    (function () {
        const endpoint = '/api/frontend-error';
        let sent = 0;
        const maxReports = 3;

        function report(type, payload) {
            if (sent >= maxReports) return;
            sent += 1;
            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, ...payload }),
                keepalive: true
            }).catch(() => {});
        }

        window.addEventListener('error', function (event) {
            report('error', {
                message: String(event.message || '').slice(0, 500),
                source: String(event.filename || '').slice(0, 255),
                line: event.lineno || null,
                col: event.colno || null,
                stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : null,
                url: location.pathname
            });
        });

        window.addEventListener('unhandledrejection', function (event) {
            const reason = event.reason || {};
            report('unhandledrejection', {
                message: String(reason.message || reason || 'Unhandled promise rejection').slice(0, 500),
                stack: reason.stack ? String(reason.stack).slice(0, 2000) : null,
                url: location.pathname
            });
        });
    })();
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
