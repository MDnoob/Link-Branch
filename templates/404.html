<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found — Link Branch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f0efec;
            color: #1a1a18;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 420px;
        }
        .logo {
            display: flex; align-items: center; justify-content: center;
            gap: 0.5rem; color: #01696f; font-weight: 600;
            font-size: 0.95rem; text-decoration: none; margin-bottom: 2.5rem;
        }
        .error-code {
            font-size: 5rem; font-weight: 700; color: #e4e2de;
            letter-spacing: -0.04em; line-height: 1; margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.25rem; font-weight: 600; color: #1a1a18;
            margin-bottom: 0.5rem;
        }
        .error-msg {
            font-size: 0.9rem; color: #888; line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-home {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.65rem 1.25rem;
            background: #01696f; color: #fff;
            border: none; border-radius: 8px;
            font-size: 0.875rem; font-weight: 500;
            font-family: inherit; cursor: pointer;
            text-decoration: none;
            transition: background 150ms;
        }
        .btn-home:hover { background: #0c4e54; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18M7.8 7.8l8.4 8.4M16.2 7.8L7.8 16.2"/></svg>
        Link Branch
    </a>
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-msg">{{ message or "This page doesn't exist or has been removed." }}</p>
    <a href="/" class="btn-home">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Go home
    </a>
</div>
</body>
</html>
