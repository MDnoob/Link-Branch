<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Branch - Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
            background:
                radial-gradient(circle at 15% 20%, rgba(1,105,111,0.18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(42,87,255,0.12), transparent 32%),
                linear-gradient(160deg, #f8f7f4 0%, #ece8e1 100%);
            font-family: 'Space Grotesk', system-ui, sans-serif;
        }
        .card {
            width: min(100%, 470px);
            border-radius: 22px;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            padding: 1.4rem;
            animation: popIn 400ms cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 1.3rem; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
        p { color: #6f6d69; font-size: 0.85rem; margin-bottom: 1rem; }
        .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 10px; padding: 0.65rem 0.75rem; font-size: 0.84rem; margin-bottom: 0.8rem; }
        label { display: block; font-size: 0.78rem; font-weight: 600; color: #53514c; margin-bottom: 0.25rem; }
        input {
            width: 100%; height: 40px; border-radius: 10px; border: 1px solid #ddd8cf;
            padding: 0 0.75rem; margin-bottom: 0.8rem; font: inherit; font-size: 0.93rem;
        }
        input:focus { outline: none; border-color: #01696f; box-shadow: 0 0 0 3px rgba(1,105,111,0.12); }
        .checks { background: #f7f6f2; border: 1px solid #ece8de; border-radius: 10px; padding: 0.6rem 0.75rem; margin: -0.2rem 0 0.8rem; }
        .checks p { font-size: 0.72rem; color: #706e68; margin-bottom: 0.35rem; }
        .checks ul { list-style: none; display: grid; gap: 0.25rem; }
        .checks li { font-size: 0.74rem; color: #9a9790; display: flex; gap: 0.35rem; align-items: center; }
        .checks li.ok { color: #166534; }
        .checks li span { width: 11px; text-align: center; font-weight: 700; }
        .btn { width: 100%; height: 42px; border-radius: 10px; border: none; background: #01696f; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        .btn:hover { background: #0c4e54; }
        .back { display: inline-block; margin-top: 0.8rem; font-size: 0.8rem; color: #01696f; text-decoration: none; font-weight: 600; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h1>Reset your password</h1>
    <p>Verify account details, then set a new password.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/forgot-password" method="post">
        <label for="username">Username (lowercase)</label>
        <input type="text" id="username" name="username" required oninput="this.value=this.value.toLowerCase()">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" required>

        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" required oninput="updatePasswordChecks(this.value)">

        <div class="checks">
            <p>Password requirements</p>
            <ul>
                <li id="c_len"><span>•</span>At least 8 characters</li>
                <li id="c_upper"><span>•</span>One uppercase letter</li>
                <li id="c_lower"><span>•</span>One lowercase letter</li>
                <li id="c_digit"><span>•</span>One number</li>
                <li id="c_symbol"><span>•</span>One special character</li>
            </ul>
        </div>

        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>

        <button type="submit" class="btn">Update password</button>
    </form>

    <a href="/login" class="back">Back to login</a>
</div>

<script>
function setCheck(id, ok) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('ok', ok);
    el.querySelector('span').textContent = ok ? '✓' : '•';
}
function updatePasswordChecks(value) {
    const v = value || '';
    setCheck('c_len', v.length >= 8);
    setCheck('c_upper', /[A-Z]/.test(v));
    setCheck('c_lower', /[a-z]/.test(v));
    setCheck('c_digit', /\d/.test(v));
    setCheck('c_symbol', /[^A-Za-z0-9]/.test(v));
}
</script>
</body>
</html>
