<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Access &mdash; Link Branch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Inter', sans-serif;
      color: #e5e5e5;
      padding: 1rem;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }
    .logo svg { color: #4ade80; }
    .logo span {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.01em;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.35rem;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #737373;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #a3a3a3;
      margin-bottom: 0.4rem;
    }
    input[type="password"] {
      width: 100%;
      background: #111;
      border: 1px solid #2e2e2e;
      border-radius: 7px;
      padding: 0.6rem 0.75rem;
      font-size: 0.875rem;
      color: #e5e5e5;
      font-family: inherit;
      outline: none;
      transition: border-color 150ms;
      letter-spacing: 0.1em;
    }
    input[type="password"]:focus { border-color: #4ade80; }
    .error {
      margin-top: 0.75rem;
      padding: 0.55rem 0.75rem;
      background: #2a1515;
      border: 1px solid #5c2020;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #f87171;
    }
    button {
      margin-top: 1.25rem;
      width: 100%;
      background: #4ade80;
      color: #0a1f0a;
      border: none;
      border-radius: 7px;
      padding: 0.65rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 150ms;
    }
    button:hover { background: #22c55e; }
    button:active { background: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span>Link Branch</span>
    </div>
    <h1>Admin Access</h1>
    <p class="subtitle">Enter your admin token to continue.</p>
    <form method="post" action="/admin/login">
      <label for="token">Admin Token</label>
      <input
        type="password"
        id="token"
        name="token"
        placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
        required
        autocomplete="current-password"
        autofocus
      />
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <button type="submit">Unlock</button>
    </form>
  </div>
</body>
</html>
